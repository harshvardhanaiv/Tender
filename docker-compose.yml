# Local development: Postgres + the app with live reload.
#
#   docker compose up --build        ->  http://127.0.0.1:8092
#
# Settings come from .env (copy .env.example; DB_PASSWORD is required).
# The repo is mounted into the container: saving a .py file restarts the app,
# and changes under web/ show on the next browser refresh.
# Background schedulers: the award/planning scrapers (which hit live external portals) are off
# in dev; the email digest scheduler is on its own flag below so automated notifications still work.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    command: flask --app server:create_app run --host 0.0.0.0 --port 8092 --debug
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ENABLE_SCHEDULERS: "0"
      ENABLE_EMAIL_SCHEDULER: "0"  # dev: a .py save restarts the worker and the startup job really sends mail; set "1" deliberately to test alerts
    # Docker's default resolver can hand back only a NAT64 IPv6 address for some portals
    # (e.g. www.etenders.gov.ie), which the container cannot route ("Network is unreachable").
    # Public DNS returns the real IPv4 address.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
